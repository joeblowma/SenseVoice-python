# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            sensevoice

      - name: Set up Python 3.13
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U twine wheel build

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

      # original publishing path
      # - name: Publish package to PyPI
        # if: github.event.action == 'published'
        # uses: pypa/gh-action-pypi-publish@master
        # with:
          # user: __token__
          # password: ${{ secrets.pypi_token }}

  pypi-publish:
    if: github.repository == 'lovemefan/SenseVoice-python'
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi
      # OPTIONAL: uncomment to include your PyPI project URL in the deployment status:
      # url: https://pypi.org/project/sensevoice-onnx/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        if: github.event.action == 'published'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_token }}
          packages-dir: dist/
